name: weekly pnl snapshot

on:
  schedule:
    # Daily retry and catch-up; only completed Taipei weeks are archived.
    - cron: "17 1,9 * * *"
  workflow_dispatch:
    inputs:
      week_key:
        description: "Optional Monday YYYY-MM-DD; empty reconciles latest 15 completed weeks"
        required: false
        default: ""
      force:
        description: "Overwrite an existing archive (manual only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mf-weekly-pnl-snapshot
  cancel-in-progress: false

jobs:
  run-weekly-pnl-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Reconcile MF weekly archives
        run: node weekly-pnl-snapshot.js
        env:
          MONEYFLOW_AXIS_BASE_URL: ${{ secrets.MONEYFLOW_AXIS_BASE_URL }}
          CRON_SECRET: ${{ secrets.MF_CRON_SECRET }}
          WEEK_KEY: ${{ inputs.week_key }}
          FORCE: ${{ inputs.force }}
